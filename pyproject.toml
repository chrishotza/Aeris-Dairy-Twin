[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-dairy-twin"
version = "0.1.0"
description = "Open multimodal state engine for dairy welfare monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Christian Marcelo Mendoza" }
]
dependencies = [
  "numpy>=1.26"
]

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
